server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. It is needed because the upstream below is written as a variable:
    # with a literal host, nginx resolves "api" once when the configuration loads and caches that
    # address forever, so restarting the API container —which gives it a new address— leaves nginx
    # talking to an address nobody answers, and every request fails with 502 until nginx is also
    # restarted. Naming the upstream through a variable forces a fresh lookup instead.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $inbox_api_host "api";

    # Single-page application: unknown paths are resolved by the Angular router shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://$inbox_api_host:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SignalR negotiates over HTTP and then upgrades to a WebSocket, so this location needs the
    # upgrade headers and a long read timeout to keep an idle inbox connected.
    location /hubs/ {
        proxy_pass http://$inbox_api_host:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
